name: Build Shattered Realms Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Export APK
        # Pin to a known-good commit of the Godot export action.
        uses: NodotProject/godot-export@0e3422217e73e94c704ae8b2c4cd142907139afb
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.5/Godot_v4.5-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.5/Godot_v4.5-stable_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          presets_to_export: Android
          verbose: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Realms-Android
          path: build/ShatteredRealms.apk
          if-no-files-found: error
          retention-days: 14
