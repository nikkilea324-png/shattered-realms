name: GdUnit4 Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Godot gameplay tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run GdUnit4
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: "4.5.2"
          version: "v6.2.1"
          paths: "res://tests"
          timeout: 10
          publish-report: true
          upload-report: true
          report-name: "shattered-realms-test-report.xml"
