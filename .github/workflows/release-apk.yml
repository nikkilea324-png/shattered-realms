name: Release Shattered Realms APK

on:
  workflow_run:
    workflows: ["Build Shattered Realms Android APK"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish APK release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Shattered-Realms-Android
          path: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -e
          test -f build/ShatteredRealms.apk
          tag="v0.1.${RUN_NUMBER}"
          gh release create "${tag}" build/ShatteredRealms.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Shattered Realms ${tag}" \
            --notes "Automated Android build from GitHub Actions run ${RUN_NUMBER}."
